<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulation — banc d'essai</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#262d37; --text:#e6e9ee; --muted:#8b95a3; --accent:#e8b04a; --good:#5cc489; --bad:#e5645b; --blue:#5aa9e6; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; font-weight:600; }
  header .date { color:var(--accent); font-variant-numeric:tabular-nums; }
  header .state { color:var(--muted); }
  main { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:12px; padding:12px 16px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; min-width:0; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; font-weight:600; }
  .kpis { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .kpi b { display:block; font-size:20px; font-variant-numeric:tabular-nums; }
  .kpi span { color:var(--muted); font-size:12px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  td { padding:2px 0; border-bottom:1px solid var(--line); }
  td:last-child { text-align:right; }
  .bar { height:8px; background:#222a35; border-radius:4px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--blue); }
  .rci { display:flex; gap:10px; align-items:flex-end; height:110px; }
  .rci div { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:4px; }
  .rci .col { width:60%; border-radius:4px 4px 0 0; }
  .ok { color:var(--good); } .ko { color:var(--bad); } .muted { color:var(--muted); }
  ul { margin:0; padding-left:18px; }
  svg text { fill:var(--muted); font-size:10px; }
</style>
</head>
<body>
<header><h1>Banc d'essai de la simulation (worker réel)</h1><span class="date" id="date">—</span><span class="state" id="state">Démarrage…</span></header>
<main id="main"></main>
<script type="module" src="../out/dashboard.js"></script>
</body>
</html>
